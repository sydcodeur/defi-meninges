spring.application.name=defi-meninges-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE}

app.cors.allowed-origins=${FRONTEND_URL}
app.api.base-url=${BACKEND_URL}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:1800000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

app.errors.expose-debug-message=false
